name: Build YD-ESP32-S3 Dual Firmware (ESP-NOW Arm & MPU)

on:
  push:
    branches: [ "Speaker", "main", "master" ]
  pull_request:
    branches: [ "Speaker", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP-IDF Firmware (Sender & Receiver)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Firmware Binaries
        shell: bash
        run: |
          # 1. Load ESP-IDF environment variables
          . /opt/esp/idf/export.sh

          # 2. Fix git safe directory warning inside container
          git config --global --add safe.directory "*"

          # 3. Create clean output directory for compiled binaries
          mkdir -p build_out

          echo "=========================================================="
          echo "Building YD-ESP32-S3: 1. Arm Receiver (Servos) Firmware"
          echo "=========================================================="

          idf.py set-target esp32s3
          idf.py -B build_receiver -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.receiver" build

          echo "=========================================================="
          echo "Building YD-ESP32-S3: 2. MPU Sender (IMU) Firmware"
          echo "=========================================================="

          idf.py -B build_sender -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.sender" build

          echo "=========================================================="
          echo "Copying Firmware Binaries to build_out/"
          echo "=========================================================="

          # Copy shared bootloader and partition table
          cp "build_receiver/bootloader/bootloader.bin" "build_out/bootloader.bin" 2>/dev/null || true
          cp "build_receiver/partition_table/partition-table.bin" "build_out/partitions.bin" 2>/dev/null || true

          # Copy Receiver and Sender app binaries
          cp "build_receiver/esp32s3_arm_receiver.bin" "build_out/esp32s3_arm_receiver.bin" 2>/dev/null || true
          cp "build_sender/esp32s3_mpu_sender.bin" "build_out/esp32s3_mpu_sender.bin" 2>/dev/null || true

          # Generate Web Flasher manifest.json supporting both builds
          echo "Generating Web Flasher manifest.json..."
          cat <<EOF > build_out/manifest.json
          {
            "name": "YD-ESP32-S3 Wireless Arm Controller (ESP-NOW)",
            "version": "2.0.0",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "name": "Arm Receiver (Servos: Claw GP1, Arm GP38, Shoulder GP39)",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "esp32s3_arm_receiver.bin", "offset": 65536 }
                ]
              },
              {
                "chipFamily": "ESP32-S3",
                "name": "MPU Sender (MPU-6050 Motion Controller: SDA GP8, SCL GP9)",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "esp32s3_mpu_sender.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          ls -la build_out/

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: yd_esp32_s3_espnow_binaries
          path: build_out/