name: Build YD-ESP32-S3 Dual Firmware (ESP-NOW Arm & MPU)

on:
  push:
    branches: [ "Speaker", "main", "master" ]
  pull_request:
    branches: [ "Speaker", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP-IDF Firmware (Sender & Receiver)
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Firmware Binaries
        shell: bash
        run: |
          # 1. Load ESP-IDF environment variables
          . /opt/esp/idf/export.sh

          # 2. Fix git safe directory warning inside container
          git config --global --add safe.directory "*"

          # 3. Create isolated output directories for sender and receiver
          mkdir -p build_out/receiver
          mkdir -p build_out/sender

          echo "=========================================================="
          echo "Building YD-ESP32-S3: 1. Arm Receiver (Servos) Firmware"
          echo "=========================================================="

          idf.py set-target esp32s3
          idf.py -B build_receiver -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.receiver" build

          echo "=========================================================="
          echo "Building YD-ESP32-S3: 2. MPU Sender (IMU) Firmware"
          echo "=========================================================="

          idf.py -B build_sender -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.sender" build

          echo "=========================================================="
          echo "Organizing Receiver Firmware Package"
          echo "=========================================================="

          cp "build_receiver/bootloader/bootloader.bin" "build_out/receiver/bootloader.bin"
          cp "build_receiver/partition_table/partition-table.bin" "build_out/receiver/partitions.bin"
          cp "build_receiver/esp32s3_arm_receiver.bin" "build_out/receiver/esp32s3_arm_receiver.bin"

          cat <<EOF > build_out/receiver/manifest.json
          {
            "name": "YD-ESP32-S3 Arm Receiver",
            "version": "2.0.0",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "esp32s3_arm_receiver.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          echo "=========================================================="
          echo "Organizing Sender Firmware Package"
          echo "=========================================================="

          cp "build_sender/bootloader/bootloader.bin" "build_out/sender/bootloader.bin"
          cp "build_sender/partition_table/partition-table.bin" "build_out/sender/partitions.bin"
          cp "build_sender/esp32s3_mpu_sender.bin" "build_out/sender/esp32s3_mpu_sender.bin"

          cat <<EOF > build_out/sender/manifest.json
          {
            "name": "YD-ESP32-S3 MPU Sender",
            "version": "2.0.0",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "esp32s3_mpu_sender.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          echo "Receiver build contents:"
          ls -la build_out/receiver/

          echo "Sender build contents:"
          ls -la build_out/sender/

      - name: Upload Arm Receiver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yd_esp32_s3_arm_receiver
          path: build_out/receiver/

      - name: Upload MPU Sender Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yd_esp32_s3_mpu_sender
          path: build_out/sender/